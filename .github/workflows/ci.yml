name: ci
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check spec/test drift
        run: bash scripts/check-drift.sh
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          APPROVED: ${{ contains(github.event.pull_request.labels.*.name, 'test-change-approved') }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
